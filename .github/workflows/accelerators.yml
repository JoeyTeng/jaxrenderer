name: Manual GPU regression

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to validate
        required: true
        type: string

permissions:
  contents: read

# Serialise GPU runs for a PR.
concurrency:
  group: accelerator-pr-${{ inputs.pr }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    outputs:
      head_sha: ${{ steps.freeze.outputs.head_sha }}
    steps:
      - name: Require the trusted default branch
        run: test "$GITHUB_REF" = 'refs/heads/master'
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Freeze the pull request and initialise the GPU check
        id: freeze
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr }}
        run: >-
          python tools/accelerator_gate.py prepare
          --pr "$PR_NUMBER" --backend gpu
          --output accelerator-binding.json --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        id: binding
        with:
          name: accelerator-binding
          path: accelerator-binding.json
          if-no-files-found: error
          retention-days: 7
      - name: Close the GPU check if preparation fails
        if: >-
          always() &&
          (steps.freeze.outcome != 'success' || steps.binding.outcome != 'success')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f accelerator-binding.json ]; then
            python tools/accelerator_gate.py finish \
              --binding accelerator-binding.json --backend gpu \
              --output-dir accelerator-artifacts/gpu --provider-success false
          fi

  gpu:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: modal-gpu
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: accelerator-binding
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.20"
          enable-cache: true
      - name: Install the locked Modal controller
        run: uv sync --locked --only-group ci-modal --python 3.14
      - name: Run the GPU regression on Modal
        id: provider
        timeout-minutes: 30
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: >-
          .venv/bin/python -m tools.modal_ci --binding accelerator-binding.json
          --output-dir accelerator-artifacts/gpu
      - name: Record the GPU result on the frozen PR commit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PROVIDER_SUCCESS: ${{ steps.provider.outcome == 'success' }}
        run: >-
          python tools/accelerator_gate.py finish
          --binding accelerator-binding.json --backend gpu
          --output-dir accelerator-artifacts/gpu
          --provider-success "$PROVIDER_SUCCESS"
      - name: Upload GPU regression artefacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gpu-${{ needs.prepare.outputs.head_sha }}
          path: accelerator-artifacts/gpu/
          if-no-files-found: warn
          retention-days: 14
