name: Manual GPU regression

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to validate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: accelerator-pr-${{ inputs.pr }}
  cancel-in-progress: false

jobs:
  gpu:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: modal-gpu
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: Require the trusted default branch
        run: test "$GITHUB_REF" = 'refs/heads/master'
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Freeze the pull request and initialise its GPU check
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr }}
        run: >-
          python tools/accelerator_gate.py prepare
          --pr "$PR_NUMBER" --backend gpu
          --output accelerator-bindings/binding.json
          --github-output "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.20"
          enable-cache: true
      - name: Install the locked Modal controller
        run: uv sync --locked --only-group ci-modal --python 3.14
      - name: Run the GPU regression on Modal
        id: provider
        if: steps.prepare.outcome == 'success'
        timeout-minutes: 30
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: >-
          .venv/bin/python -m tools.modal_ci
          --binding accelerator-bindings/binding.json
          --output-dir accelerator-artifacts/gpu
      - name: Record the GPU result on the frozen PR commit
        if: >-
          always() &&
          hashFiles('accelerator-bindings/binding.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PROVIDER_SUCCESS: ${{ steps.provider.outcome == 'success' }}
        run: >-
          python tools/accelerator_gate.py finish
          --binding accelerator-bindings/binding.json --backend gpu
          --output-dir accelerator-artifacts/gpu
          --provider-success "$PROVIDER_SUCCESS"
      - name: Upload the GPU result and binding
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gpu-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            accelerator-bindings/binding.json
            accelerator-artifacts/
          if-no-files-found: warn
          retention-days: 14
