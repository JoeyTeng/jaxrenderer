# This workflow installs the locked dependencies, runs tests, and checks code style.

name: lint & test

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.20"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-groups --python "${{ matrix.python-version }}"

      - name: Check Python version
        run: uv run --no-sync --python "${{ matrix.python-version }}" python --version

      - name: Lint with isort
        if: matrix.python-version == '3.14'
        run: uv run --no-sync --python "${{ matrix.python-version }}" isort --check-only --jobs -1 .

      - name: Lint with black
        if: matrix.python-version == '3.14'
        # The checked-in Matplotlib stubs under typings/ follow upstream formatting.
        run: uv run --no-sync --python "${{ matrix.python-version }}" black --check assets renderer examples test_resources tests

      - name: Run pyright
        if: matrix.python-version == '3.14'
        # Keep the strict JAX compatibility diagnostics visible while the existing API debt is addressed.
        continue-on-error: true
        run: uv run --no-sync --python "${{ matrix.python-version }}" pyright

      - name: Run tests
        run: uv run --no-sync --python "${{ matrix.python-version }}" pytest tests/ --import-mode importlib

  macos-render-regression:
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      JAX_PLATFORMS: cpu
      MPLBACKEND: Agg
      JAXRENDERER_ARTIFACT_DIR: render-artifacts

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.20"
          enable-cache: true

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install locked dependencies
        run: uv sync --locked --all-groups --python 3.14

      - name: Check Python version
        run: uv run --no-sync python --version

      - name: Run render and gradient regression tests
        timeout-minutes: 12
        run: uv run --no-sync python -m pytest -q tests/render_regression.py tests/test_smoke_grad.py

      - name: Upload render regression artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-render-regression
          path: render-artifacts/
          if-no-files-found: warn
          retention-days: 7
