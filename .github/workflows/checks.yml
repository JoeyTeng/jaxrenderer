# This workflow installs the locked dependencies, runs tests, and checks code style.

name: lint & test

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.before }}
          path: ruff-base

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.20"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-groups --python 3.14

      - name: Check import sorting with Ruff
        run: uv run --no-sync --python 3.14 ruff check --select I assets renderer examples test_resources tests tools

      - name: Check formatting with Ruff
        # The checked-in Matplotlib stubs under typings/ follow upstream formatting.
        run: uv run --no-sync --python 3.14 ruff format --check assets renderer examples test_resources tests tools

      - name: Check for new Ruff lint violations
        run: uv run --no-sync --python 3.14 python tools/check_ruff_lint.py --base-root ruff-base --candidate-root . --paths assets renderer examples test_resources tests tools

  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.20"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-groups --python "${{ matrix.python-version }}"

      - name: Check Python version
        run: uv run --no-sync --python "${{ matrix.python-version }}" python --version

      - name: Run pyright
        if: matrix.python-version == '3.14'
        # Keep the strict JAX compatibility diagnostics visible while the existing API debt is addressed.
        continue-on-error: true
        run: uv run --no-sync --python "${{ matrix.python-version }}" pyright

      - name: Run tests
        run: uv run --no-sync --python "${{ matrix.python-version }}" pytest tests/ --import-mode importlib

  macos-render-regression:
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      JAX_PLATFORMS: cpu
      MPLBACKEND: Agg
      JAXRENDERER_ARTIFACT_DIR: render-artifacts

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.20"
          enable-cache: true

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install locked dependencies
        run: uv sync --locked --all-groups --python 3.14

      - name: Check Python version
        run: uv run --no-sync python --version

      - name: Run render and gradient regression tests
        timeout-minutes: 12
        run: uv run --no-sync python -m pytest -q tests/render_regression.py tests/test_smoke_grad.py

      - name: Upload render regression artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-render-regression
          path: render-artifacts/
          if-no-files-found: warn
          retention-days: 7

  numpy-minimum:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JAX_PLATFORMS: cpu
      MPLBACKEND: Agg
      JAXRENDERER_ARTIFACT_DIR: render-artifacts

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.20"
          enable-cache: true

      - name: Build wheel
        run: uv build --wheel

      - name: Create isolated Python 3.13 environment
        run: uv venv .venv-numpy-minimum --python 3.13

      - name: Install test dependencies with NumPy 2.1.3
        run: >-
          uv pip install --python .venv-numpy-minimum/bin/python
          --group dev --group test "numpy==2.1.3"

      - name: Install built wheel and check package metadata
        run: |
          uv pip install --python .venv-numpy-minimum/bin/python dist/*.whl
          uv pip check --python .venv-numpy-minimum/bin/python
          .venv-numpy-minimum/bin/python -c 'import numpy; assert numpy.__version__ == "2.1.3", numpy.__version__'

      - name: Run full test suite
        run: .venv-numpy-minimum/bin/python -m pytest tests/ --import-mode importlib

      - name: Run render and gradient regression tests
        timeout-minutes: 12
        run: .venv-numpy-minimum/bin/python -m pytest -q tests/render_regression.py tests/test_smoke_grad.py

      - name: Upload render regression artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ubuntu-numpy-2.1.3-render-regression
          path: render-artifacts/
          if-no-files-found: warn
          retention-days: 7
