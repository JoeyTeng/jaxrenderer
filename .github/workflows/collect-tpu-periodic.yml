name: Collect delayed TPU results periodically

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: tpu-periodic-collection
  cancel-in-progress: false

jobs:
  discover:
    if: github.repository == 'JoeyTeng/jaxrenderer' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      has_sources: ${{ steps.discover.outputs.has_sources }}
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Find eligible timed-out TPU source runs
        id: discover
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python -m tools.tpu_collection_periodic discover
          --output-dir periodic-discovery --github-output "$GITHUB_OUTPUT"
      - name: Upload periodic discovery evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tpu-periodic-discovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: periodic-discovery/
          if-no-files-found: warn
          retention-days: 30

  collect:
    needs: discover
    if: needs.discover.outputs.has_sources == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: kaggle-tpu
    concurrency:
      group: tpu-collection-${{ matrix.source_run_id }}-${{ matrix.source_attempt }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.20"
          enable-cache: true
      - name: Install the locked Kaggle controller
        run: uv sync --locked --only-group ci-kaggle --python 3.14
      - name: Collect and validate the delayed TPU result
        id: collect
        env:
          GH_TOKEN: ${{ github.token }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME }}
          SOURCE_RUN_ID: ${{ matrix.source_run_id }}
          SOURCE_ATTEMPT: ${{ matrix.source_attempt }}
          SOURCE_COMMIT: ${{ matrix.commit }}
        run: >-
          .venv/bin/python -u -m tools.tpu_collection_periodic collect
          --source-run "$SOURCE_RUN_ID"
          --source-attempt "$SOURCE_ATTEMPT"
          --commit "$SOURCE_COMMIT"
          --output-dir periodic-artifacts --github-output "$GITHUB_OUTPUT"
      - name: Upload periodic collection evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tpu-periodic-${{ matrix.commit }}-${{ matrix.source_run_id }}-${{ matrix.source_attempt }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: periodic-artifacts/
          if-no-files-found: warn
          retention-days: 30
      - name: Record terminal collection marker
        if: always() && steps.collect.outputs.terminal == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: tpu-periodic-terminal-${{ matrix.source_run_id }}-${{ matrix.source_attempt }}-${{ matrix.commit }}
          path: periodic-artifacts/periodic-terminal.json
          if-no-files-found: error
          retention-days: 30
