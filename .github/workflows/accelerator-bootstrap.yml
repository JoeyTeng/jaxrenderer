name: Temporary accelerator bootstrap

on:
  push:
    branches: [wip/accelerator-ci]

permissions:
  contents: read

# Remove this workflow and the bootstrap controller option before merging PR #25.
# Only explicitly marked commits start provider work. Each run freezes its own
# head/base/attempt and submits a fresh private Kaggle kernel; no automatic retry.
concurrency:
  group: accelerator-pr-25
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.repository == 'JoeyTeng/jaxrenderer' &&
      startsWith(github.event.head_commit.message, '[accelerator-bootstrap]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    outputs:
      head_sha: ${{ steps.freeze.outputs.head_sha }}
    steps:
      - name: Require the authorised bootstrap branch
        run: test "$GITHUB_REF" = 'refs/heads/wip/accelerator-ci'
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Freeze the pull request and initialise selected checks
        id: freeze
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python tools/accelerator_gate.py prepare
          --pr 25 --backend both --bootstrap-pr 25
          --output accelerator-binding.json --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: accelerator-binding
          path: accelerator-binding.json
          if-no-files-found: error
          retention-days: 7

  gpu:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: modal-gpu
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: accelerator-binding
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.20"
          enable-cache: true
      - name: Install the locked Modal controller
        run: uv sync --locked --only-group ci-modal --python 3.14
      - name: Run the GPU regression on Modal
        id: provider
        timeout-minutes: 30
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: >-
          .venv/bin/python -m tools.modal_ci --binding accelerator-binding.json
          --output-dir accelerator-artifacts/gpu
      - name: Record the GPU result on the frozen PR commit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PROVIDER_SUCCESS: ${{ steps.provider.outcome == 'success' }}
        run: >-
          python tools/accelerator_gate.py finish
          --binding accelerator-binding.json --backend gpu
          --output-dir accelerator-artifacts/gpu
          --provider-success "$PROVIDER_SUCCESS"
      - name: Upload GPU regression artefacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gpu-${{ needs.prepare.outputs.head_sha }}
          path: accelerator-artifacts/gpu/
          if-no-files-found: warn
          retention-days: 14

  tpu:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: kaggle-tpu
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: accelerator-binding
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.20"
          enable-cache: true
      - name: Install the locked Kaggle controller
        run: uv sync --locked --only-group ci-kaggle --python 3.14
      - name: Run the TPU regression on Kaggle
        id: provider
        timeout-minutes: 30
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME }}
        run: >-
          .venv/bin/python -m tools.kaggle_ci --binding accelerator-binding.json
          --output-dir accelerator-artifacts/tpu
      - name: Record the TPU result on the frozen PR commit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PROVIDER_SUCCESS: ${{ steps.provider.outcome == 'success' }}
        run: >-
          python tools/accelerator_gate.py finish
          --binding accelerator-binding.json --backend tpu
          --output-dir accelerator-artifacts/tpu
          --provider-success "$PROVIDER_SUCCESS"
      - name: Upload TPU regression artefacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tpu-${{ needs.prepare.outputs.head_sha }}
          path: accelerator-artifacts/tpu/
          if-no-files-found: warn
          retention-days: 14
