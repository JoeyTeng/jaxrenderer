name: Temporary Kaggle result recovery

on:
  push:
    branches: [wip/accelerator-ci]

permissions:
  contents: read
  actions: read

# Read only the notebook submitted by the first PR #25 bootstrap attempt.
# This workflow does not submit another notebook or invoke Modal.
jobs:
  recover:
    if: >-
      github.repository == 'JoeyTeng/jaxrenderer' &&
      startsWith(github.event.head_commit.message, '[accelerator-recovery]')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: kaggle-tpu
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: accelerator-binding
          run-id: 37278198939
          github-token: ${{ github.token }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.20"
          enable-cache: true
      - name: Install the locked Kaggle controller
        run: uv sync --locked --only-group ci-kaggle --python 3.14
      - name: Recover the existing notebook result
        timeout-minutes: 4
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME }}
        run: >-
          .venv/bin/python -m tools.kaggle_recovery
          --binding accelerator-binding.json --output-dir recovered-tpu
      - name: Upload recovered TPU artefacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: recovered-tpu-37278198939
          path: recovered-tpu/
          if-no-files-found: warn
          retention-days: 14
