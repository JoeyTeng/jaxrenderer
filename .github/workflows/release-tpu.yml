name: TPU release confirmation

on:
  workflow_call:
    inputs:
      commit:
        description: Frozen release commit SHA
        required: true
        type: string
  workflow_dispatch:
    inputs:
      commit:
        description: Full commit SHA to confirm before publishing a release
        required: true
        type: string

permissions:
  contents: read

# Serialise submissions for the same candidate. An Actions cancellation does
# not prove that an already submitted Kaggle notebook has stopped.
concurrency:
  group: release-tpu-${{ inputs.commit }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      head_sha: ${{ steps.freeze.outputs.head_sha }}
    steps:
      - &release-checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - &release-python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Freeze the release candidate and workflow attempt
        id: freeze
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ inputs.commit }}
        run: >-
          python -m tools.release_tpu_gate prepare
          --commit "$RELEASE_COMMIT"
          --output tpu-release-binding.json --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: tpu-release-binding-${{ github.run_attempt }}
          path: tpu-release-binding.json
          if-no-files-found: error
          retention-days: 30

  tpu-segment-1:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: kaggle-tpu
    steps:
      - *release-checkout
      - &release-binding-download
        uses: actions/download-artifact@v7
        with:
          name: tpu-release-binding-${{ github.run_attempt }}
      - *release-python
      - &kaggle-uv-setup
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.20"
          enable-cache: true
      - &kaggle-controller-install
        name: Install the locked Kaggle controller
        run: uv sync --locked --only-group ci-kaggle --python 3.14
      - name: Submit the release candidate to a Kaggle TPU
        id: provider
        timeout-minutes: 350
        env: &kaggle-provider-env
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME }}
        run: >-
          .venv/bin/python -u -m tools.kaggle_ci --binding tpu-release-binding.json
          --relay
          --output-dir release-artifacts/tpu
      - name: Upload TPU relay state
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-tpu-segment-1-${{ needs.prepare.outputs.head_sha }}-${{ github.run_attempt }}
          path: release-artifacts/tpu/
          if-no-files-found: warn
          retention-days: 30
      - &canonical-tpu-failure-upload
        name: Preserve the canonical TPU failure report
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with: &canonical-tpu-report
          name: release-tpu-${{ needs.prepare.outputs.head_sha }}-${{ github.run_attempt }}
          path: release-artifacts/tpu/
          if-no-files-found: warn
          retention-days: 30

  tpu-segment-2:
    needs: [prepare, tpu-segment-1]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: kaggle-tpu
    steps:
      - *release-checkout
      - *release-binding-download
      - uses: actions/download-artifact@v7
        with:
          name: release-tpu-segment-1-${{ needs.prepare.outputs.head_sha }}-${{ github.run_attempt }}
          path: release-artifacts/tpu/
      - *release-python
      - *kaggle-uv-setup
      - *kaggle-controller-install
      - &continue-tpu-provider
        name: Continue the Kaggle TPU confirmation
        id: provider
        timeout-minutes: 350
        env: *kaggle-provider-env
        run: >-
          .venv/bin/python -u -m tools.kaggle_ci --binding tpu-release-binding.json
          --relay --continue-state release-artifacts/tpu/kaggle-controller-state.json
          --output-dir release-artifacts/tpu
      - name: Upload TPU relay state
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-tpu-segment-2-${{ needs.prepare.outputs.head_sha }}-${{ github.run_attempt }}
          path: release-artifacts/tpu/
          if-no-files-found: warn
          retention-days: 30
      - *canonical-tpu-failure-upload

  tpu-segment-3:
    needs: [prepare, tpu-segment-2]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: kaggle-tpu
    steps:
      - *release-checkout
      - *release-binding-download
      - uses: actions/download-artifact@v7
        with:
          name: release-tpu-segment-2-${{ needs.prepare.outputs.head_sha }}-${{ github.run_attempt }}
          path: release-artifacts/tpu/
      - *release-python
      - *kaggle-uv-setup
      - *kaggle-controller-install
      - *continue-tpu-provider
      - name: Upload TPU relay state
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-tpu-segment-3-${{ needs.prepare.outputs.head_sha }}-${{ github.run_attempt }}
          path: release-artifacts/tpu/
          if-no-files-found: warn
          retention-days: 30
      - *canonical-tpu-failure-upload

  tpu:
    needs: [prepare, tpu-segment-3]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: kaggle-tpu
    steps:
      - *release-checkout
      - *release-binding-download
      - uses: actions/download-artifact@v7
        with:
          name: release-tpu-segment-3-${{ needs.prepare.outputs.head_sha }}-${{ github.run_attempt }}
          path: release-artifacts/tpu/
      - *release-python
      - *kaggle-uv-setup
      - *kaggle-controller-install
      - name: Finish the Kaggle TPU confirmation
        id: provider
        timeout-minutes: 350
        env: *kaggle-provider-env
        run: >-
          .venv/bin/python -u -m tools.kaggle_ci --binding tpu-release-binding.json
          --relay --continue-state release-artifacts/tpu/kaggle-controller-state.json
          --final-segment --output-dir release-artifacts/tpu
      - name: Validate the bound TPU result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PROVIDER_SUCCESS: ${{ steps.provider.outcome == 'success' }}
        run: >-
          python -m tools.release_tpu_gate finish
          --binding tpu-release-binding.json --output-dir release-artifacts/tpu
          --provider-success "$PROVIDER_SUCCESS"
      - name: Upload TPU release confirmation artefacts
        if: always()
        uses: actions/upload-artifact@v7
        with: *canonical-tpu-report
