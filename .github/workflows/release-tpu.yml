name: TPU release submission

on:
  workflow_call:
    inputs:
      commit:
        description: Frozen release commit SHA
        required: true
        type: string
  workflow_dispatch:
    inputs:
      commit:
        description: Full commit SHA to submit for release validation
        required: true
        type: string

permissions:
  contents: read

# Serialise submissions for the same candidate. An Actions cancellation does
# not prove that an already submitted Kaggle notebook has stopped.
concurrency:
  group: release-tpu-${{ inputs.commit }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: kaggle-tpu
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Freeze the release candidate and workflow attempt
        id: freeze
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ inputs.commit }}
        run: >-
          python -m tools.release_tpu_gate prepare
          --commit "$RELEASE_COMMIT"
          --output tpu-release-binding.json --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: tpu-release-binding-${{ github.run_attempt }}
          path: tpu-release-binding.json
          if-no-files-found: error
          retention-days: 30
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.20"
          enable-cache: true
      - name: Install the locked Kaggle controller
        run: uv sync --locked --only-group ci-kaggle --python 3.14
      - name: Submit the release candidate to a Kaggle TPU
        timeout-minutes: 10
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME }}
        run: >-
          .venv/bin/python -u -m tools.kaggle_ci --binding tpu-release-binding.json
          --relay --submit-only --output-dir release-artifacts/tpu
      - name: Retain TPU submission state
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-tpu-${{ inputs.commit }}-${{ github.run_attempt }}
          path: release-artifacts/tpu/
          if-no-files-found: warn
          retention-days: 30
