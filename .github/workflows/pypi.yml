name: Build, validate and publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing published tag to recover; leave empty for a rehearsal
        required: false
        default: ""
        type: string

permissions:
  contents: read

# Never cancel a candidate while a remote accelerator run may still be active.
concurrency:
  group: publish-${{ inputs.release_tag || github.event.release.tag_name || github.sha }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      head_sha: ${{ steps.freeze.outputs.head_sha }}
      version: ${{ steps.candidate.outputs.version }}
      publish: ${{ steps.candidate.outputs.publish }}
      mode: ${{ steps.candidate.outputs.mode }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Select and bind the release candidate
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_TAG: ${{ inputs.release_tag }}
        run: >-
          python -m tools.release_candidate prepare --recovery-tag "$RECOVERY_TAG"
          --output candidate-binding.json --github-output "$GITHUB_OUTPUT"
      - name: Freeze and validate the candidate
        id: freeze
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ steps.candidate.outputs.head_sha }}
        run: >-
          python -m tools.release_tpu_gate prepare --commit "$RELEASE_COMMIT"
          --output release-binding.json --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: release-binding-${{ github.run_attempt }}
          path: release-binding.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v7
        with:
          name: candidate-binding-${{ github.run_attempt }}
          path: candidate-binding.json
          if-no-files-found: error
          retention-days: 30
      - name: Mark the recovery source for delayed-collection discovery
        if: steps.candidate.outputs.mode == 'recovery'
        uses: actions/upload-artifact@v7
        with:
          name: recovery-source-binding-${{ github.run_attempt }}
          path: candidate-binding.json
          if-no-files-found: error
          retention-days: 30

  cpu:
    needs: prepare
    uses: ./.github/workflows/checks.yml
    with:
      commit: ${{ needs.prepare.outputs.head_sha }}

  build:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.head_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.20"
          enable-cache: true
      - name: Build package once
        run: uv build
      - name: Smoke test built wheel
        env:
          PACKAGE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          smoke_venv="$(mktemp -d)"
          trap 'python -c "import shutil, sys; shutil.rmtree(sys.argv[1])" "$smoke_venv"' EXIT
          python -m venv "$smoke_venv"
          uv pip install --python "$smoke_venv/bin/python" dist/*.whl
          (
            cd "$smoke_venv"
            ./bin/python - <<'PY'
          import importlib.metadata
          import os
          from pathlib import Path

          import renderer

          expected = os.environ["PACKAGE_VERSION"]
          actual = importlib.metadata.version("jaxrenderer")
          module_path = Path(renderer.__file__).resolve()
          site_packages = Path(importlib.metadata.distribution("jaxrenderer").locate_file("")).resolve()
          assert actual == expected, f"installed version {actual!r} does not match release tag {expected!r}"
          assert module_path.is_relative_to(site_packages), f"renderer imported from outside the installed distribution: {module_path}"
          PY
          )
      - name: Retain the validated distributions
        uses: actions/upload-artifact@v7
        with:
          name: release-dist-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  # Work around reported environment-secret resolution failures in reusable workflows.
  # See https://github.com/actions/runner/issues/4453.
  gpu:
    needs: [prepare, cpu, build]
    uses: ./.github/workflows/release-gpu.yml
    with:
      commit: ${{ needs.prepare.outputs.head_sha }}
    secrets: inherit

  tpu:
    needs: [prepare, cpu, build]
    uses: ./.github/workflows/release-tpu.yml
    with:
      commit: ${{ needs.prepare.outputs.head_sha }}
    secrets: inherit

  publish:
    needs: [prepare, cpu, build, gpu, tpu]
    if: ${{ success() && needs.prepare.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: PyPI
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.20"
      - uses: actions/download-artifact@v7
        with:
          name: release-binding-${{ github.run_attempt }}
      - uses: actions/download-artifact@v7
        with:
          name: candidate-binding-${{ github.run_attempt }}
      - name: Recheck the tag and frozen workflow attempt
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.head_sha }}
          RECOVERY_TAG: ${{ inputs.release_tag }}
        run: |
          python -m tools.release_candidate verify --binding candidate-binding.json \
            --recovery-tag "$RECOVERY_TAG"
          python -m tools.release_tpu_gate prepare --commit "$RELEASE_COMMIT" \
            --output publish-binding.json --github-output "$GITHUB_OUTPUT"
          cmp release-binding.json publish-binding.json
      - uses: actions/download-artifact@v7
        with:
          name: release-dist-${{ github.run_attempt }}
          path: dist/
      - name: Publish the validated distributions
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: uv publish

  rehearsal:
    needs: [prepare, cpu, build, gpu, tpu]
    if: ${{ success() && needs.prepare.outputs.publish == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@v7
        with:
          name: release-binding-${{ github.run_attempt }}
      - uses: actions/download-artifact@v7
        with:
          name: candidate-binding-${{ github.run_attempt }}
      - name: Recheck the frozen workflow attempt
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.head_sha }}
          RECOVERY_TAG: ${{ inputs.release_tag }}
        run: |
          python -m tools.release_candidate verify --binding candidate-binding.json \
            --recovery-tag "$RECOVERY_TAG"
          python -m tools.release_tpu_gate prepare --commit "$RELEASE_COMMIT" \
            --output rehearsal-binding.json --github-output "$GITHUB_OUTPUT"
          cmp release-binding.json rehearsal-binding.json
      - uses: actions/download-artifact@v7
        with:
          name: release-dist-${{ github.run_attempt }}
          path: dist/
      - name: Summarise the validated release rehearsal
        env:
          CANDIDATE_SHA: ${{ needs.prepare.outputs.head_sha }}
          PACKAGE_VERSION: ${{ needs.prepare.outputs.version }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          printf 'Release rehearsal passed for %s, package version %s, workflow attempt %s.\n' \
            "$CANDIDATE_SHA" "$PACKAGE_VERSION" "$RUN_ATTEMPT" >> "$GITHUB_STEP_SUMMARY"
