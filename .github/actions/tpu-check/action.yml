name: Continue TPU release confirmation
description: Continue a restored, bound Kaggle TPU relay.
inputs:
  state-directory:
    description: Runner temporary directory containing the restored controller state.
    required: true
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@v7
      with:
        name: tpu-release-binding-${{ github.run_attempt }}
    - name: Verify the restored controller state
      shell: bash
      env:
        TPU_OUTPUT_DIR: ${{ inputs.state-directory }}
      run: test -s "$TPU_OUTPUT_DIR/kaggle-controller-state.json"
    - uses: actions/setup-python@v7
      with:
        python-version: "3.14"
    - uses: astral-sh/setup-uv@v10.2.0
      with:
        version: "0.12.20"
        enable-cache: true
    - name: Install the locked Kaggle controller
      shell: bash
      run: uv sync --locked --only-group ci-kaggle --python 3.14
    - name: Continue the Kaggle TPU confirmation
      shell: bash
      env:
        TPU_OUTPUT_DIR: ${{ inputs.state-directory }}
      run: >-
        .venv/bin/python -u -m tools.kaggle_ci
        --binding tpu-release-binding.json
        --relay
        --continue-state "$TPU_OUTPUT_DIR/kaggle-controller-state.json"
        --output-dir "$TPU_OUTPUT_DIR"
