name: Continue TPU release confirmation
description: Restore a bound Kaggle TPU relay and continue its controller.
inputs:
  previous-artifact:
    description: Same-attempt artefact containing the previous controller state.
    required: true
  final-segment:
    description: Whether this is the final relay segment (true or false).
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: "3.14"
    - uses: astral-sh/setup-uv@v10.2.0
      with:
        version: "0.12.20"
        enable-cache: true
    - name: Install the locked Kaggle controller
      shell: bash
      run: uv sync --locked --only-group ci-kaggle --python 3.14
    - uses: actions/download-artifact@v7
      with:
        name: tpu-release-binding-${{ github.run_attempt }}
    - uses: actions/download-artifact@v7
      with:
        name: ${{ inputs.previous-artifact }}
        path: release-artifacts/tpu/
    - name: Verify the restored controller state
      shell: bash
      run: test -s release-artifacts/tpu/kaggle-controller-state.json
    - name: Continue the Kaggle TPU confirmation
      shell: bash
      env:
        FINAL_SEGMENT: ${{ inputs.final-segment }}
      run: |
        if [[ "$FINAL_SEGMENT" == "true" ]]; then
          segment_flag=(--final-segment)
        elif [[ "$FINAL_SEGMENT" == "false" ]]; then
          segment_flag=()
        else
          echo "final-segment must be true or false" >&2
          exit 2
        fi
        exec .venv/bin/python -u -m tools.kaggle_ci \
          --binding tpu-release-binding.json \
          --relay \
          --continue-state release-artifacts/tpu/kaggle-controller-state.json \
          "${segment_flag[@]}" \
          --output-dir release-artifacts/tpu
