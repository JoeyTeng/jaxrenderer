[project]
name = "jaxrenderer"
version = "0.4.0"
description = "Jax implementation of rasterizer renderer."
authors = [{ name = "Joey Teng", email = "joey.teng.dev@gmail.com" }]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.12,<3.15"
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Visualization",
    "Development Status :: 3 - Alpha",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Natural Language :: Chinese (Simplified)",
    "Natural Language :: English",
    "Typing :: Typed",
]
dependencies = [
    "jax>=0.11.2",
    "jaxlib>=0.11.2",
    "jaxtyping>=0.3.11",
    "numpy>=2.1.3",
    "typing_extensions>=4.16.0",
]

[project.urls]
Homepage = "https://github.com/JoeyTeng/jaxrenderer"
Repository = "https://github.com/JoeyTeng/jaxrenderer"
"Bug Tracker" = "https://github.com/JoeyTeng/jaxrenderer/issues"

[dependency-groups]
ci-modal = ["modal==1.6.1"]
ci-kaggle = ["kaggle==2.2.4"]
dev = [
    "ruff==0.16.9",
    "matplotlib>=3.11.2",
    "pillow>=12.3.0",
    "pyright>=1.1.414",
]
test = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "PyYAML>=6.0.3",
    "tox>=4.64.5",
    "tox-uv>=1.36.0",
]

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["renderer"]

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["assets", "renderer", "examples", "test_resources", "tests", "tools"]
include = [
    "assets/**/*.py",
    "assets/**/*.pyi",
    "renderer/**/*.py",
    "renderer/**/*.pyi",
    "examples/**/*.py",
    "examples/**/*.pyi",
    "test_resources/**/*.py",
    "test_resources/**/*.pyi",
    "tests/**/*.py",
    "tests/**/*.pyi",
    "tools/**/*.py",
    "tools/**/*.pyi",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["F722", "F821"]

[tool.ruff.lint.isort]
case-sensitive = true
force-sort-within-sections = true
known-first-party = ["renderer", "examples", "test_resources"]
order-by-type = true

[tool.pyright]
include = ["renderer", "examples", "test_resources", "tests"]
exclude = ["typings/**", ".*/**", "**/node_modules", "**/__pycache__"]
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

pythonVersion = "3.14"
pythonPlatform = "All"

executionEnvironments = [
  { root = ".", pythonVersion = "3.14", pythonPlatform = "All" },
]

reportCallInDefaultInitializer = "information"
reportImplicitOverride = "information"
reportImplicitStringConcatenation = "none"
reportImportCycles = "error"
reportMissingSuperCall = "information"
reportPropertyTypeMismatch = "information"
reportUninitializedInstanceVariable = "warning"
reportUnnecessaryTypeIgnoreComment = "warning"
reportUnusedCallResult = "information"
