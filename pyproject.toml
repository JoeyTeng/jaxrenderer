[project]
name = "jaxrenderer"
version = "0.3.2"
description = "Jax implementation of rasterizer renderer."
authors = [{ name = "Joey Teng", email = "joey.teng.dev@gmail.com" }]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.9,<3.15"
classifiers = [
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Visualization",
    "Development Status :: 3 - Alpha",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Natural Language :: Chinese (Simplified)",
    "Natural Language :: English",
    "Typing :: Typed",
]
dependencies = [
    "jax>=0.4.0",
    "jaxlib>=0.4.0",
    "jaxtyping>=0.2.19",
    "numpy>=1.22.0",
    "typing_extensions>=4.3.0",
]

[project.urls]
Homepage = "https://github.com/JoeyTeng/jaxrenderer"
Repository = "https://github.com/JoeyTeng/jaxrenderer"
"Bug Tracker" = "https://github.com/JoeyTeng/jaxrenderer/issues"

[dependency-groups]
dev = [
    "black==23.7.0",
    "isort==5.12.0",
    "matplotlib>=3.6.2",
    "pillow>=9.4.0",
    "pyright>=1.1.407",
    "importlib-resources>=5.12.0",
]
test = [
    "pre-commit>=3.3.3",
    "pytest>=7.0.0",
    "tox>=4.0.0",
    "tox-uv>=1.29; python_version >= '3.10'",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["renderer"]

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]

[tool.isort]
profile = "black"
py_version = 311
src_paths = ["renderer", "examples", "test_resources", "tests"]
line_length = 88
combine_star = true
order_by_type = true
case_sensitive = true
force_sort_within_sections = true
split_on_trailing_comma = true
only_modified = true
skip_gitignore = true

[tool.black]
target-version = ["py39"]

[tool.pyright]
include = ["renderer", "examples", "test_resources", "tests"]
exclude = ["typings/**", ".*/**", "**/node_modules", "**/__pycache__"]
typeCheckingMode = "strict"

pythonVersion = "3.14"
pythonPlatform = "All"

executionEnvironments = [
  { root = ".", pythonVersion = "3.14", pythonPlatform = "All" },
]

reportCallInDefaultInitializer = "information"
reportImplicitOverride = "information"
reportImplicitStringConcatenation = "none"
reportImportCycles = "error"
reportMissingSuperCall = "information"
reportPropertyTypeMismatch = "information"
reportUninitializedInstanceVariable = "warning"
reportUnnecessaryTypeIgnoreComment = "warning"
reportUnusedCallResult = "information"
